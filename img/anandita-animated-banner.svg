<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="auto">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="retroGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e9d5ff" stroke-width="1.2" />
    </pattern>

    <!-- Radial Soft Vignette Gradient -->
    <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="65%">
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="90%" stop-color="#faf8ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#faf8ff" stop-opacity="1" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Purple Header Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Embedded Animations for Standalone SVG Preview */
      @keyframes floatLetter {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes pulseLive {
        0%, 100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.35);
          opacity: 1;
        }
      }

      @keyframes cursorBob {
        0%, 100% {
          transform: translate(0px, 0px);
        }
        50% {
          transform: translate(6px, -6px);
        }
      }

      @keyframes sparkleRotate {
        0% {
          transform: rotate(0deg) scale(0.9);
        }
        50% {
          transform: rotate(180deg) scale(1.15);
        }
        100% {
          transform: rotate(360deg) scale(0.9);
        }
      }

      .text-main {
        font-family: 'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif;
        font-weight: 900;
        text-anchor: middle;
      }

      .text-sub {
        font-family: 'Poppins', 'Montserrat', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
      }

      .letter-bounce-1 { animation: floatLetter 2.4s ease-in-out infinite 0.00s; }
      .letter-bounce-2 { animation: floatLetter 2.4s ease-in-out infinite 0.12s; }
      .letter-bounce-3 { animation: floatLetter 2.4s ease-in-out infinite 0.24s; }
      .letter-bounce-4 { animation: floatLetter 2.4s ease-in-out infinite 0.36s; }
      .letter-bounce-5 { animation: floatLetter 2.4s ease-in-out infinite 0.48s; }
      .letter-bounce-6 { animation: floatLetter 2.4s ease-in-out infinite 0.60s; }
      .letter-bounce-7 { animation: floatLetter 2.4s ease-in-out infinite 0.72s; }
      .letter-bounce-8 { animation: floatLetter 2.4s ease-in-out infinite 0.84s; }

      .pulse-dot {
        transform-origin: center;
        animation: pulseLive 1.8s ease-in-out infinite;
      }

      .cursor-motion {
        animation: cursorBob 3s ease-in-out infinite;
      }

      .sparkle-motion {
        transform-origin: center;
        animation: sparkleRotate 6s linear infinite;
      }
    </style>
  </defs>

  <!-- ==================== 1. RETRO SOLID DROP SHADOW ==================== -->
  <rect x="22" y="24" width="876" height="294" rx="26" fill="#2e1065" />

  <!-- ==================== 2. MAIN CARD ARTBOARD CANVAS ==================== -->
  <rect x="14" y="16" width="876" height="294" rx="26" fill="#faf8ff" stroke="#2e1065" stroke-width="4" />

  <!-- Grid Texture Layer -->
  <rect x="16" y="18" width="872" height="290" rx="24" fill="url(#retroGrid)" />

  <!-- Soft Vignette Fade Overlay -->
  <rect x="16" y="18" width="872" height="290" rx="24" fill="url(#vignetteGrad)" />

  <!-- ==================== 3. RETRO ARTBOARD BOUNDING BOX & CORNER HANDLES ==================== -->
  <!-- Inner dashed guide line -->
  <rect x="36" y="38" width="832" height="250" rx="14" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.6" />

  <!-- 4 Corner Anchor Handles (Hero Artboard Motif) -->
  <rect x="30" y="32" width="12" height="12" rx="2.5" fill="#c084fc" stroke="#2e1065" stroke-width="2" />
  <rect x="862" y="32" width="12" height="12" rx="2.5" fill="#c084fc" stroke="#2e1065" stroke-width="2" />
  <rect x="30" y="282" width="12" height="12" rx="2.5" fill="#c084fc" stroke="#2e1065" stroke-width="2" />
  <rect x="862" y="282" width="12" height="12" rx="2.5" fill="#c084fc" stroke="#2e1065" stroke-width="2" />

  <!-- ==================== 4. WASHI TAPE STRIP (TOP MOTIF) ==================== -->
  <g transform="translate(452, 16) rotate(-1)">
    <rect x="-65" y="-9" width="130" height="20" rx="3" fill="#fef08a" stroke="#2e1065" stroke-width="2" />
    <line x1="-55" y1="-9" x2="-45" y2="11" stroke="#ef4444" stroke-width="3" />
    <line x1="-35" y1="-9" x2="-25" y2="11" stroke="#ef4444" stroke-width="3" />
    <line x1="-15" y1="-9" x2="-5" y2="11" stroke="#ef4444" stroke-width="3" />
    <line x1="5" y1="-9" x2="15" y2="11" stroke="#ef4444" stroke-width="3" />
    <line x1="25" y1="-9" x2="35" y2="11" stroke="#ef4444" stroke-width="3" />
    <line x1="45" y1="-9" x2="55" y2="11" stroke="#ef4444" stroke-width="3" />
  </g>

  <!-- ==================== 5. TOP STATUS PILL BADGE ==================== -->
  <g transform="translate(452, 54)">
    <rect x="-185" y="0" width="370" height="30" rx="15" fill="#ffffff" stroke="#2e1065" stroke-width="2.5" filter="drop-shadow(0 3px 0 #2e1065)" />
    <!-- Live Green Pulse Dot -->
    <circle cx="-162" cy="15" r="5" fill="#22c55e" class="pulse-dot" />
    <circle cx="-162" cy="15" r="7" fill="none" stroke="#86efac" stroke-width="1.5" class="pulse-dot" />
    <text x="5" y="20" class="text-sub" font-size="11" font-weight="800" fill="#2e1065" letter-spacing="1.5" text-anchor="middle">
      REKAYASA PERANGKAT LUNAK &#8226; SYSTEM ONLINE
    </text>
  </g>

  <!-- ==================== 6. DECORATIVE RETRO CROSSHAIRS & SPARKLES ==================== -->
  <!-- Top Left Sparkle -->
  <g transform="translate(85, 80)" class="sparkle-motion">
    <path d="M 0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z" fill="#7c3aed" stroke="#2e1065" stroke-width="1.5" />
  </g>
  <!-- Bottom Right Sparkle -->
  <g transform="translate(820, 240)" class="sparkle-motion">
    <path d="M 0 -12 L 2.5 -2.5 L 12 0 L 2.5 2.5 L 0 12 L -2.5 2.5 L -12 0 L -2.5 -2.5 Z" fill="#facc15" stroke="#2e1065" stroke-width="1.5" />
  </g>

  <!-- Code Tag Badge (Left) -->
  <g transform="translate(70, 160)">
    <rect x="0" y="0" width="60" height="32" rx="10" fill="#ede9fe" stroke="#2e1065" stroke-width="2" filter="drop-shadow(0 3px 0 #2e1065)" />
    <text x="30" y="21" class="text-sub" font-size="13" font-weight="900" fill="#7c3aed" text-anchor="middle">&lt; / &gt;</text>
  </g>

  <!-- Star Badge (Right) -->
  <g transform="translate(775, 145)">
    <rect x="0" y="0" width="70" height="34" rx="10" fill="#fef9c3" stroke="#2e1065" stroke-width="2" filter="drop-shadow(0 3px 0 #2e1065)" />
    <text x="35" y="22" class="text-sub" font-size="12" font-weight="800" fill="#a16207" text-anchor="middle">SMKS</text>
  </g>

  <!-- ==================== 7. MAIN ANIMATED NAME: ANANDITA ==================== -->
  <!-- 3D Extrusion Shadow Layer for "ANANDITA" -->
  <g transform="translate(452, 160)" class="text-main" font-size="74" fill="#2e1065">
    <text x="-252" y="10" class="letter-bounce-1">A</text>
    <text x="-180" y="10" class="letter-bounce-2">N</text>
    <text x="-108" y="10" class="letter-bounce-3">A</text>
    <text x="-36" y="10" class="letter-bounce-4">N</text>
    <text x="36" y="10" class="letter-bounce-5">D</text>
    <text x="108" y="10" class="letter-bounce-6">I</text>
    <text x="168" y="10" class="letter-bounce-7">T</text>
    <text x="240" y="10" class="letter-bounce-8">A</text>
  </g>

  <!-- Middle Ambient Depth Shadow -->
  <g transform="translate(452, 160)" class="text-main" font-size="74" fill="#c084fc">
    <text x="-254" y="6" class="letter-bounce-1">A</text>
    <text x="-182" y="6" class="letter-bounce-2">N</text>
    <text x="-110" y="6" class="letter-bounce-3">A</text>
    <text x="-38" y="6" class="letter-bounce-4">N</text>
    <text x="34" y="6" class="letter-bounce-5">D</text>
    <text x="106" y="6" class="letter-bounce-6">I</text>
    <text x="166" y="6" class="letter-bounce-7">T</text>
    <text x="238" y="6" class="letter-bounce-8">A</text>
  </g>

  <!-- Front Crisp White Letters with Solid Dark Purple Outline -->
  <g transform="translate(452, 160)" class="text-main" font-size="74" fill="#ffffff" stroke="#2e1065" stroke-width="4.5" stroke-linejoin="round">
    <text x="-256" y="0" class="letter-bounce-1">A</text>
    <text x="-184" y="0" class="letter-bounce-2">N</text>
    <text x="-112" y="0" class="letter-bounce-3">A</text>
    <text x="-40" y="0" class="letter-bounce-4">N</text>
    <text x="32" y="0" class="letter-bounce-5">D</text>
    <text x="104" y="0" class="letter-bounce-6">I</text>
    <text x="164" y="0" class="letter-bounce-7">T</text>
    <text x="236" y="0" class="letter-bounce-8">A</text>
  </g>

  <!-- ==================== 8. SUBTITLE: GALUH SEKAR KINANTI ==================== -->
  <g transform="translate(452, 208)">
    <!-- Shadow -->
    <text x="2" y="3" class="text-sub" font-size="24" font-weight="900" fill="#2e1065" letter-spacing="6" text-anchor="middle">
      GALUH SEKAR KINANTI
    </text>
    <!-- Foreground in Gold -->
    <text x="0" y="0" class="text-sub" font-size="24" font-weight="900" fill="url(#goldGrad)" stroke="#2e1065" stroke-width="1.8" letter-spacing="6" text-anchor="middle">
      GALUH SEKAR KINANTI
    </text>
    <!-- Dot in Electric Purple -->
    <circle cx="218" cy="-6" r="5" fill="#a855f7" stroke="#2e1065" stroke-width="1.5" />
  </g>

  <!-- ==================== 9. BOTTOM SPECIFICATION TAGS ROW ==================== -->
  <g transform="translate(452, 258)">
    <!-- Tag 1: School -->
    <g transform="translate(-230, 0)">
      <rect x="-85" y="0" width="170" height="26" rx="13" fill="#ffffff" stroke="#2e1065" stroke-width="2" filter="drop-shadow(0 2.5px 0 #2e1065)" />
      <text x="0" y="17" class="text-sub" font-size="10" font-weight="800" fill="#2e1065" text-anchor="middle">SMKS BRANTAS</text>
    </g>

    <!-- Tag 2: Role (Gold) -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="0" width="190" height="26" rx="13" fill="#facc15" stroke="#2e1065" stroke-width="2" filter="drop-shadow(0 2.5px 0 #2e1065)" />
      <text x="0" y="17" class="text-sub" font-size="10" font-weight="900" fill="#2e1065" text-anchor="middle">FRONTEND &#8226; UI/UX &#8226; PYTHON</text>
    </g>

    <!-- Tag 3: Location -->
    <g transform="translate(230, 0)">
      <rect x="-85" y="0" width="170" height="26" rx="13" fill="#ffffff" stroke="#2e1065" stroke-width="2" filter="drop-shadow(0 2.5px 0 #2e1065)" />
      <text x="0" y="17" class="text-sub" font-size="10" font-weight="800" fill="#2e1065" text-anchor="middle">MALANG, INDONESIA</text>
    </g>
  </g>

  <!-- ==================== 10. FLOATING AUTHOR CURSOR BADGE ==================== -->
  <g transform="translate(680, 185)" class="cursor-motion">
    <!-- Cursor Arrow -->
    <path d="M 0 0 L 0 18 L 4.5 14 L 9 22 L 12.5 20.5 L 8 12.5 L 14 12.5 Z" fill="#2e1065" />
    <path d="M 1.5 2 L 1.5 15 L 4.5 12.5 L 8.5 20 L 10.5 19 L 6.5 11.5 L 11.5 11.5 Z" fill="#bef264" />

    <!-- Name Label Badge -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="105" height="22" rx="11" fill="#7c3aed" stroke="#2e1065" stroke-width="1.8" filter="drop-shadow(0 2px 0 #2e1065)" />
      <text x="52" y="15" class="text-sub" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">Anandita (RPL)</text>
    </g>
  </g>
</svg>
